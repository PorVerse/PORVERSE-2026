<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>You’re offline</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0b1020; color: #fff; display:grid; place-items:center; min-height:100vh; }
    .card { max-width: 520px; padding: 24px; border-radius: 16px; background: rgba(255,255,255,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    h1 { margin:0 0 8px; font-size: 28px; }
    p { margin: 0 0 12px; color: #cbd5e1; }
    .hint { font-size: 14px; opacity:.8 }
    .btn { display:inline-block; margin-top:12px; padding:10px 16px; border-radius:12px; background:#8b5cf6; color:#fff; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>We’ll keep your progress safe. When you’re back online, data will sync automatically.</p>
    <p class="hint">Tip: pages you’ve recently opened should still load from cache.</p>
    <a class="btn" href="/">Go Home</a>
  </div>
</body>
</html>
